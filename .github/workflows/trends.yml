name: Global Trends Scanner

on:

  workflow_dispatch:

  schedule:
    - cron: "0 * * * *"


jobs:

  trends:

    runs-on: ubuntu-latest

    timeout-minutes: 10


    steps:

      # ==========================
      # DOWNLOAD PROJECT
      # ==========================

      - name: Checkout repository

        uses: actions/checkout@v4


      # ==========================
      # PYTHON
      # ==========================

      - name: Setup Python

        uses: actions/setup-python@v5

        with:
          python-version: "3.11"


      # ==========================
      # DEPENDENCIES
      # ==========================

      - name: Install dependencies

        run: |

          pip install -r requirements.txt


      # ==========================
      # RUN TREND ENGINE
      # ==========================

      - name: Scan global trends

        env:

          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}

        run: |

          python main.py


      # ==========================
      # SAVE RESULTS
      # ==========================

      - name: Upload trend data

        uses: actions/upload-artifact@v4

        with:

          name: trend-data

          path: data/trend_candidates.json

          retention-days: 7
